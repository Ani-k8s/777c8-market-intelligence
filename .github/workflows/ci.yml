name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: 777c8_market_test
          POSTGRES_USER: 777c8
          POSTGRES_PASSWORD: 777c8_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U 777c8 -d 777c8_market_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Run backend tests
        env:
          DJANGO_DEBUG: "True"
          DJANGO_SECRET_KEY: ci-secret
          ADMIN_USERNAME: Admin
          ADMIN_PASSWORD: Admin@123
          DATABASE_URL: postgres://777c8:777c8_test_password@localhost:5432/777c8_market_test
          DATABASE_SSL_REQUIRE: "False"
        run: python manage.py test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm install
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build
